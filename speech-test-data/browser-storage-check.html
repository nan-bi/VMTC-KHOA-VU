  await new Promise((resolve,reject)=>{const r=indexedDB.deleteDatabase(name);r.onsuccess=resolve;r.onerror=reject;});
  out.textContent+='ALL PASS · native IndexedDB; isolated test database removed; real cases untouched.\n';
 }else{
  await new Promise((resolve,reject)=>{const r=indexedDB.open(name,3);r.onupgradeneeded=()=>{r.result.createObjectStore('results',{keyPath:'id'});r.result.createObjectStore('drafts',{keyPath:'id'});};r.onsuccess=()=>{r.result.close();resolve();};r.onerror=reject;});
  const identity={id:'test-case',owner:'owner-a'};let state=blank();for(const key of ['pid','visit','order','doctor'])state=reducer(state,{type:'patient',key,value:'TEST-'+key});
  state=reducer(state,{type:'begin'});state=reducer(state,{type:'append',text:'Nội dung thử nghiệm lưu trình duyệt.'});
  await store.saveDraft(identity,state);check(identity.claimed,'draft acknowledged only after transaction commit');

  await rejects(()=>store.saveReviewedResult(record.id,1,{doctor:'TEST',transcript:'Overwrite'}),'stale review rejected');
  const draftIdentity={id:'incomplete',owner:'owner-a'};const partial=reducer(blank(),{type:'edit',value:'Bản nháp còn thiếu thông tin.'});
  await store.saveDraft(draftIdentity,partial);await store.restoreDraft('incomplete','owner-b');

  const link=document.createElement('a');link.textContent='Reload and verify saved cases';link.href='?db='+encodeURIComponent(name)+'&reopen=1';document.body.append(link);
 }
